name: integrated_legal_client_monorepo_devcontainer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dev_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    working_dir: /workspaces/Integrated_Legal_Client_Monorepo
    command: sleep infinity
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://user:password@db:5432/dev_db
    volumes:
      - ..:/workspaces/Integrated_Legal_Client_Monorepo:cached
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: services/web/Dockerfile
    working_dir: /workspaces/Integrated_Legal_Client_Monorepo
    command: sleep infinity
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://user:password@db:5432/dev_db
    volumes:
      - ..:/workspaces/Integrated_Legal_Client_Monorepo:cached
    depends_on:
      api:
        condition: service_started
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
