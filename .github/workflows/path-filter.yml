name: Path Filter

on:
  workflow_call:
    outputs:
      fe:
        description: "Frontend files changed"
        value: ${{ jobs.changes.outputs.fe }}
      be:
        description: "Backend files changed"
        value: ${{ jobs.changes.outputs.be }}
      types:
        description: "Shared types files changed"
        value: ${{ jobs.changes.outputs.types }}
      root:
        description: "Root-level files changed"
        value: ${{ jobs.changes.outputs.root }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fe: ${{ steps.filter.outputs.fe }}
      be: ${{ steps.filter.outputs.be }}
      types: ${{ steps.filter.outputs.types }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            fe:
              - 'services/web/**'
            be:
              - 'services/api/**'
            types:
              - 'packages/types/**'
            root:
              - '*'
