name: Push Docker Images to Google Artifact Registry 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: 'integrated-legal-client-portal'
  AR_REPO_LOCATION: 'us-west1'

jobs:
  changes:
    uses: ./.github/workflows/path-filter.yml
    permissions:
      contents: read
      pull-requests: read

  build_and_push_images:
    needs: changes
    if: needs.changes.outputs.types == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.fe == 'true' || needs.changes.outputs.be == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Google Auth
        if: github.event_name == 'push'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Docker Auth
        if: github.event_name == 'push'
        id: docker-auth
        uses: docker/login-action@v4
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          registry: ${{ env.AR_REPO_LOCATION }}-docker.pkg.dev

      - name: Build Backend Image
        if: needs.changes.outputs.types == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.be == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy.be
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/backend:{1}', secrets.AR_URL, github.sha) || 'backend:local' }}

      - name: Build Frontend Image
        if: needs.changes.outputs.types == 'true' || needs.changes.outputs.root == 'true' || needs.changes.outputs.fe == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy.fe
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/frontend:{1}', secrets.AR_URL, github.sha) || 'frontend:local' }}