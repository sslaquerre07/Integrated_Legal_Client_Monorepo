name: Monorepo Lint

on:
  pull_request:
    branches: ["main"]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fe: ${{ steps.filter.outputs.fe }}
      be: ${{ steps.filter.outputs.be }}
      types: ${{ steps.filter.outputs.types }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            fe:
              - 'services/web/**'
            be:
              - 'services/api/**'
            types:
              - 'packages/types/**'

  lint-fe:
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix services/web run lint

  lint-be:
    needs: changes
    if: needs.changes.outputs.be == 'true'
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix services/api run lint

  lint-types:
    needs: changes
    if: needs.changes.outputs.types == 'true'
    name: Lint Shared Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix packages/types run lint