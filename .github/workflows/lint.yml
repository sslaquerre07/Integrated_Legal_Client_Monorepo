name: Monorepo Lint

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-paths:
    uses: ./.github/workflows/path-filter.yml

  lint-fe:
    needs: check-paths
    if: needs.check-paths.outputs.fe == 'true'
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix services/web run lint

  lint-be:
    needs: check-paths
    if: needs.check-paths.outputs.be == 'true'
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix services/api run lint

  lint-types:
    needs: check-paths
    if: needs.check-paths.outputs.types == 'true'
    name: Lint Shared Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix packages/types run lint